version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: maz_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: maz_travel
      MYSQL_USER: maz_user
      MYSQL_PASSWORD: maz_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - maz_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maz_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://maz_user:maz_pass@mysql:3306/maz_travel"
      JWT_SECRET: "change_this_secret_in_production_please"
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGIN: "http://localhost,http://localhost:80,http://localhost:3000"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      MAIL_FROM: "Maz Travel <no-reply@maztravel.ma>"
      MAIL_TO: "contact@maztravel.ma"
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "5000:5000"
    networks:
      - maz_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maz_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost/api"
      NEXT_PUBLIC_WHATSAPP: "+212600000000"
      NEXT_PUBLIC_SITE_URL: "http://localhost"
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - maz_network

  nginx:
    image: nginx:alpine
    container_name: maz_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - maz_network

volumes:
  mysql_data:

networks:
  maz_network:
    driver: bridge
